name: Atualizar conta e publicar site

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia ~06:17 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Baixar dados da HoYoLAB e criptografar
        env:
          HOYOLAB_COOKIES: ${{ secrets.HOYOLAB_COOKIES }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          HSR_UID: ${{ vars.HSR_UID }}
        run: python scripts/fetch_account.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
